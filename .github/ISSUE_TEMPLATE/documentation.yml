name: Documentation issue
description: Report missing, incorrect, or confusing Hamster documentation.
title: "[Docs]: "
labels: [documentation, needs-triage]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      placeholder: hamster man fork, language syntax page, README section, or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: catalog
    attributes:
      label: Catalog consistency
      options:
        - label: I checked whether the CLI manual and website disagree.
