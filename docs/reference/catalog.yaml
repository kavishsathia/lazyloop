schema: hamster.reference/v1alpha1
entries:
  - id: loop.goal
    title: Goal loop
    kind: loop
    aliases: [goal]
    keywords: [goal, with]
    since: 0.1.0
    stability: experimental
    summary: Repeats agent work until every verifier passes or an active limit terminates the run.
    syntax: ['goal { goal-statement* } [with flow { flow-statement* }]']
    semantics:
      - Policies and limits activate in source order before agent work begins.
      - A declarative goal probes its ordered verifier ladder after every hook-visible tool call.
      - An attached flow changes the cadence to one probe after each complete flow cycle.
      - Verification stops at the first failure; all verifiers passing completes the goal automatically.
    postconditions:
      - predicate: every verify is true
        description: Normal completion requires all declared verifiers to pass in one boundary evaluation.
        guarantee: enforced
        evidence: persisted verifier results
    failures:
      - code: limit_exceeded
        when: An active time or attempt limit is exhausted.
        remediation: Increase the bound or inspect the failing verifier.
    examples:
      - title: Make tests pass
        language: hamster
        test: parse
        source: |
          goal {
            limit attempts 8;
            verify tests = bash.check("go test ./...");
            return "green";
          }
    related: [statement.verify, statement.limit, loop.flow]

  - id: loop.flow
    title: Attached flow
    kind: execution-policy
    aliases: [flow]
    keywords: [flow]
    since: 0.1.0
    stability: experimental
    summary: Constrains an enclosing goal to repeat an ordered sequence of agent and runtime-owned statements between verification probes.
    syntax: ['goal { goal-statement* } with flow { flow-statement+ }']
    semantics:
      - A flow cannot execute or terminate independently of its goal.
      - Statements execute in source order; only the completed cycle triggers the goal verifier ladder.
      - A failed goal probe begins the next cycle without opening unconstrained agent work.
    postconditions:
      - predicate: enclosing goal controls termination
        description: The flow ends only when the enclosing goal's ordered verifiers all pass.
        guarantee: enforced
        evidence: persisted verifier results at the iteration boundary
    examples:
      - title: Branch, repair, and verify
        language: hamster
        test: parse
        source: |
          goal {
            verify clean = bash.check("git diff --check");
            return fix;
          } with flow {
            step branch = bash.run("git switch -c repair");
            step fix = goal {
              verify tests = bash.check("go test ./...");
              return "fixed";
            };
          }
    related: [statement.step, loop.goal, loop.foreach]

  - id: loop.foreach
    title: Foreach loop
    kind: loop
    aliases: [foreach]
    keywords: [foreach, in]
    since: 0.1.0
    stability: experimental
    summary: Runs one goal or nested foreach to completion for every value in a sequence.
    syntax: ['foreach binding in sequence { goal | foreach }']
    semantics:
      - Each element receives an independent execution of the inner loop.
      - The inner return value becomes the result for that element and result order follows input order.
    preconditions:
      - predicate: sequence evaluates to a list
        description: The foreach source must be an enumerable Hamster list.
        checked: runtime
    postconditions:
      - predicate: every element loop completed
        description: Normal completion means the inner contract passed for every element.
        guarantee: enforced
        evidence: one persisted child result per input element
    examples:
      - title: Check packages
        language: hamster
        test: parse
        source: |
          foreach package in ["./internal/store", "./internal/runtime"] {
            goal {
              verify tests = bash.check("go test ./...");
              return package;
            }
          }
    related: [loop.goal, loop.flow, statement.return]

  - id: statement.step
    title: Step
    kind: statement
    aliases: [step]
    keywords: [step]
    since: 0.1.0
    stability: experimental
    summary: Names one agent-owned operation in an ordered flow.
    syntax: ['step name = expression;', 'step name = goal|foreach { ... };', 'step child = fork;']
    semantics:
      - Steps are legal only inside flow.
      - Nested loops are themselves steps and must complete before the next step begins.
      - Fork is a step because Codex owns the subagent spawn action; exec and wait are runtime-owned statements.
    postconditions:
      - predicate: value is bound to name
        description: Later statements can reference the step result by its name.
        guarantee: enforced
        evidence: machine stack value
    examples:
      - title: Exact shell step
        language: hamster
        test: parse
        source: |
          goal {
            verify clean = bash.check("git diff --check");
            return status;
          } with flow {
            step status = bash.run("git status --short");
          }
    related: [loop.flow, primitive.bash-run, process.fork]

  - id: statement.if
    title: Conditional branch
    kind: statement
    aliases: [if]
    keywords: [if]
    since: 0.1.0
    stability: experimental
    summary: Selects a runtime-owned flow branch from an evaluated condition.
    syntax: ['if expression { flow-statement* }']
    semantics:
      - Hamster evaluates the condition without asking Codex to choose a branch.
      - Fork handles expose child and parent booleans for OS-like post-fork control flow.
    postconditions:
      - predicate: only the selected branch executes
        description: False conditions skip the complete body; true conditions enter it.
        guarantee: enforced
        evidence: persisted branch state transition
    examples:
      - title: Child-only exec
        language: hamster
        test: parse
        source: 'goal { verify done = true; } with flow { step child = fork; if child.child { exec child-work; } wait child; }'
    related: [process.fork, process.exec, loop.flow]

  - id: statement.verify
    title: Verify
    kind: statement
    aliases: [verify]
    keywords: [verify]
    since: 0.1.0
    stability: experimental
    summary: Declares an independently evaluated condition required for normal loop completion.
    syntax: ['verify name = expression;']
    semantics:
      - Verification is runtime-owned rather than agent-owned.
      - Verifiers run in source order and evaluation stops at the first false or errored result.
      - A declarative goal probes after every hook-visible tool call; a goal with an attached flow probes after each complete flow cycle.
      - Passing the full verifier ladder completes the goal automatically.
    postconditions:
      - predicate: verifier result and evidence are persisted
        description: Each evaluation is observable in runtime state and traces.
        guarantee: enforced
        evidence: verifier result record
    examples:
      - title: Test verifier
        language: hamster
        test: parse
        source: 'goal { verify tests = bash.check("go test ./..."); return true; }'
    related: [primitive.bash-check, loop.goal, loop.flow]

  - id: statement.trap
    title: Trap
    kind: statement
    aliases: [trap]
    keywords: [trap]
    since: 0.1.0
    stability: experimental
    summary: Suspends the run and transfers control to the supervising human for a decision Hamster cannot compute.
    syntax: ['trap name = user.approve("question");', 'trap name = user.select("question", options: [a, b]);']
    semantics:
      - A trap is the subjective counterpart of verify; verify asks the machine, trap asks the person.
      - In a goal a trap is a completion gate on the verifier ladder, so the machine cannot certify itself done. In a flow it is a checkpoint between steps.
      - Traps are always evaluated after every verifier regardless of source order, so a person is only ever asked about work the machine has already accepted.
      - A goal needs at least one gate, but not a machine-checkable one. Work whose only standard of completion is human judgement is gated entirely by traps.
      - Reaching a trap suspends the run with status trapped and denies every agent tool call until it is resolved.
      - Resolution is reserved for a supervisor outside Codex; the running agent is denied hamster resolve.
      - An approved trap advances the flow. A rejected trap re-derives the work from the machine's initial state, exactly like a failed verifier, so a verdict costs a re-run and never a rewrite.
      - The prompt must be a static string literal and a selection's options must be a static list, so every question is reviewable before the run starts.
      - Supervisor attention is budgeted with limit traps; a run that would exceed its declared budget fails closed.
    preconditions:
      - predicate: request is user.approve or user.select
        description: Hamster only emits a trap whose answer space it can validate a verdict against.
        checked: compiler
    postconditions:
      - predicate: the run makes no further progress until a human answers
        description: Every agent tool call is denied while a trap is open.
        guarantee: enforced
        evidence: persisted trap record and denied hook decisions
      - predicate: one question is asked at most once per occurrence
        description: Traps are keyed by run, state, and iteration, so a replayed hook re-attaches to the same question.
        guarantee: enforced
        evidence: unique trap occurrence index
    failures:
      - code: trap_budget_exhausted
        when: The run would raise more traps than limit traps declares.
        remediation: Raise the budget, or learn the judgement upfront so it stops reaching the supervisor.
      - code: trap_resolution_rejected
        when: A verdict does not match the trap's declared answer space.
        remediation: Approve or reject an approval trap; choose a declared option for a selection trap.
    examples:
      - title: Approval gate
        language: hamster
        test: parse
        source: 'goal { verify done = true; } with flow { step build = bash.run("make"); trap shipped = user.approve("Does this build look right?"); }'
      - title: Choose between forked results
        language: hamster
        test: parse
        source: 'goal { verify done = true; } with flow { step alpha = fork; if alpha.child { exec style-alpha; } wait alpha; trap style = user.select("Which error style?", options: ["result", "sentinel"]); }'
    related: [statement.verify, statement.limit, process.fork, command.traps]

  - id: command.taste
    title: Taste profile
    kind: command
    aliases: [taste]
    since: 0.1.0
    stability: experimental
    summary: Records and adopts the repository's standing statement of subjective standards.
    syntax: ['hamster taste record --name NAME --clause TEXT [--question TEXT]', 'hamster taste show [--drafts] [--json]', 'hamster taste ratify [--name NAME]', 'hamster taste revoke --name NAME']
    semantics:
      - The agent conducts the interview and reports what it heard, so recording and reading are agent operations.
      - A recorded clause is a draft and carries no authority. Ratifying and revoking are denied to the agent at the hook.
      - hamster taste show returns only ratified clauses unless --drafts is passed, so an unratified proposal can never be applied as if it were the supervisor's standard.
      - A ratified clause is immutable. Correcting one requires an explicit supervisor revoke, which stops an agent loosening the standard it is graded against.
      - The profile is scoped to a repository and persists across runs, so the interview happens once rather than every session.
    postconditions:
      - predicate: only ratified clauses form the standing profile
        description: Drafts are stored but excluded from the profile an automated judge reads.
        guarantee: enforced
        evidence: clause status and denied hook decisions
    failures:
      - code: taste_already_ratified
        when: An agent proposes a clause whose name is already adopted.
        remediation: Ask the supervisor to revoke the clause before proposing a replacement.
    related: [statement.trap, command.traps]

  - id: command.traps
    title: Review queue
    kind: command
    aliases: [traps, resolve]
    since: 0.1.0
    stability: experimental
    summary: Lists open traps and records the supervisor's verdict from outside Codex.
    syntax: ['hamster traps [--all] [--json]', 'hamster resolve TRAP_ID (--approve|--reject|--choose OPTION) [--note TEXT]']
    semantics:
      - The queue is the supervisor's whole interface to a running loop; answering it is batched and asynchronous.
      - Rejecting requires a note, because the agent re-derives the work from that reasoning.
      - Resolving a trap immediately resumes the suspended run.
      - The agent may read the queue through the hook but is denied resolution.
      - A Hamster command must be the entire tool call. One composed with other shell work is refused, because the parser that enforces who may run what only sees a whole invocation.
      - This is a guardrail rather than a sandbox. An agent running as the same user can reach the daemon directly; the enforcement stops shortcuts, not deliberate evasion.
    postconditions:
      - predicate: resolving releases the suspended run
        description: The daemon pumps the machine as soon as a verdict is recorded.
        guarantee: enforced
        evidence: run status transition from trapped to running
    related: [statement.trap]

  - id: statement.judge
    title: Judge
    kind: statement
    aliases: [judge]
    keywords: [judge]
    since: 0.1.0
    stability: experimental
    summary: Delegates a subjective check to a constrained observer that applies one ratified taste clause.
    syntax: ['judge name = taste.check("command");', 'judge name = taste.check(["command", "command"], escalate_after: 2, audit: 20);']
    semantics:
      - The judge name is the taste clause it applies. A clause the supervisor has not ratified gives the observer no standing, so the judgement escalates to a trap instead of being guessed at.
      - There is no judge instruction in the runtime. A judge desugars to fork, exec, wait, and a verdict dispatch, so the observer is a separate agent with a cleared context and an allow-list it cannot escape.
      - The observer may run Hamster commands and nothing else. It structurally cannot edit code, run tests, or spawn further agents.
      - Evidence is gathered by the parent from statically declared commands and frozen before the fork, so the observer cannot choose what to look at and the work under review cannot choose what it is shown.
      - A verdict is three-valued. Pass advances, fail re-derives the work like any failed gate, and abstain transfers control to the supervisor.
      - A pass or fail without a citation is coerced to an abstention, so an unsupported opinion escalates to a human rather than passing as taste.
      - An observer answers once. A recorded verdict is immutable, and an observer that never speaks times out and abstains rather than hanging the parent.
      - limit judgements bounds the money observers cost, which is a different resource from the attention limit traps bounds.
      - escalate_after bounds consecutive failures before the question becomes a human's, defaulting to 3. Not every taste failure is one the agent can perceive, so repeating it spends attempts without converging.
      - audit samples one in N passing verdicts for human spot-checking. An audit questions the judge rather than the work and never blocks the run.
      - Resolving an escalated trap, or flagging an audit, records the supervisor's reasoning as a draft refinement of the clause. The standing profile still only changes when a human adopts it.
    preconditions:
      - predicate: a ratified clause of the same name exists
        description: An observer applies the supervisor's standard and has none of its own.
        checked: runtime
    postconditions:
      - predicate: the observer cannot modify the work it judges
        description: The synthesized observer machine allows Hamster commands only.
        guarantee: enforced
        evidence: observer allow-list and denied hook decisions
      - predicate: an undecidable judgement reaches a human
        description: Abstention, a missing clause, and a silent observer all route to a trap.
        guarantee: enforced
        evidence: persisted verdict and trap record
    failures:
      - code: judge_unratified_clause
        when: No ratified taste clause matches the judge name.
        remediation: Record and ratify the clause, or answer the escalated trap directly.
      - code: judgement_budget_exhausted
        when: The run would open more judgements than limit judgements declares.
        remediation: Raise the budget or reduce the number of judged points.
    examples:
      - title: Judge naming against the ratified profile
        language: hamster
        test: parse
        source: 'goal { verify tests = bash.check("go test ./..."); } with flow { step build = bash.run("go build ./..."); judge naming = taste.check("git diff -- *.go"); }'
    related: [statement.trap, statement.verify, command.taste, command.audits, process.fork]

  - id: command.audits
    title: Verdict audits
    kind: command
    aliases: [audits, audit]
    since: 0.1.0
    stability: experimental
    summary: Spot-checks sampled passing verdicts to test whether a taste clause still says what it should.
    syntax: ['hamster audits [--all] [--json]', 'hamster audit JUDGEMENT_ID (--agree | --flag --note TEXT)']
    semantics:
      - An audit questions the observer, not the work, so it never blocks a run. The run already advanced on the verdict.
      - Sampling is declared per judge with audit N, meaning one in every N passing verdicts.
      - Auditing is denied to the agent at the hook; an agent grading its own grader proves nothing.
      - Flagging requires a note, which becomes a draft refinement of the clause the observer applied.
    postconditions:
      - predicate: a flagged verdict proposes a clause refinement
        description: Disagreement with an observer is captured as taste rather than lost.
        guarantee: enforced
        evidence: draft taste clause sourced from the verdict
    related: [statement.judge, command.taste]

  - id: statement.limit
    title: Limit
    kind: statement
    aliases: [limit]
    keywords: [limit]
    since: 0.1.0
    stability: experimental
    summary: Activates a prospective time or attempt bound from its position in the loop.
    syntax: ['limit kind expression;']
    semantics:
      - A limit starts counting only after execution reaches its clause.
      - Work completed before the clause does not consume that limit.
      - Unsupported kinds, including cost until Codex exposes trustworthy usage evidence, fail compilation instead of running unenforced.
    postconditions:
      - predicate: exhausted limit terminates the loop
        description: The runtime refuses another iteration once an active bound is exhausted.
        guarantee: enforced
        evidence: persisted activation time and counters
    examples:
      - title: Prospective limits
        language: hamster
        test: parse
        source: 'goal { limit time "20m"; limit attempts 5; verify done = true; return true; }'
    related: [loop.goal, loop.flow]

  - id: statement.allow
    title: Allow policy
    kind: statement
    aliases: [allow]
    keywords: [allow]
    since: 0.1.0
    stability: experimental
    summary: Defines a tool allowlist policy from this point in a loop.
    syntax: ['allow expression;']
    semantics:
      - Hook-visible calls outside the allowlist are blocked while the policy is active.
      - Calls that Codex does not expose to hooks cannot be intercepted.
    postconditions:
      - predicate: disallowed hook-visible tool calls do not execute
        description: The pre-tool hook rejects observable calls outside the active allowlist.
        guarantee: enforced
        evidence: Codex pre-tool hook decision
    examples:
      - title: Restrict tools
        language: hamster
        test: parse
        source: 'goal { allow "bash"; verify done = true; return true; }'
    related: [statement.disallow]

  - id: statement.disallow
    title: Disallow policy
    kind: statement
    aliases: [disallow]
    keywords: [disallow]
    since: 0.1.0
    stability: experimental
    summary: Defines a tool blacklist policy from this point in a loop.
    syntax: ['disallow expression;']
    semantics:
      - Matching hook-visible calls are blocked before execution.
      - Calls absent from the Codex hook stream remain outside enforcement.
    postconditions:
      - predicate: matching hook-visible calls do not execute
        description: The pre-tool hook rejects observable calls matching the blacklist.
        guarantee: enforced
        evidence: Codex pre-tool hook decision
    examples:
      - title: Block network shell
        language: hamster
        test: parse
        source: 'goal { disallow "curl"; verify done = true; return true; }'
    related: [statement.allow]

  - id: statement.return
    title: Return
    kind: statement
    aliases: [return]
    keywords: [return]
    since: 0.1.0
    stability: experimental
    summary: Defines the structured value emitted after a loop completes normally.
    syntax: ['return expression;']
    semantics:
      - Return does not bypass verification; its expression is the loop result after the boundary passes.
      - A foreach collects one inner return value per element.
    postconditions:
      - predicate: result is persisted
        description: Parent processes and waiters receive the structured result.
        guarantee: enforced
        evidence: run result record
    examples:
      - title: Return a step
        language: hamster
        test: parse
        source: 'goal { verify done = true; return "complete"; }'
    related: [loop.foreach, process.wait]

  - id: language.expressions
    title: Expressions and literals
    kind: language
    aliases: [expressions, literals]
    keywords: [true, false]
    since: 0.1.0
    stability: experimental
    summary: Values, lists, calls, members, named arguments, unary negation, and boolean/comparison operators.
    syntax: ['true | false | number | string | [expressions]', 'receiver.member(arguments)', '!x | x && y | x || y | comparisons']
    semantics:
      - Operator precedence is unary, comparison, equality, logical AND, then logical OR.
      - Calls may mix positional values and name:value arguments.
    postconditions:
      - predicate: expression evaluates to a runtime value
        description: Evaluation either produces a typed value or a runtime diagnostic.
        guarantee: enforced
        evidence: evaluator result
    examples:
      - title: Boolean expression
        language: hamster
        test: parse
        source: 'goal { verify ready = true && !false; return [1, "two"]; }'
    related: [statement.verify]

  - id: process.fork
    title: Fork a process
    kind: process
    aliases: [fork]
    keywords: [fork]
    since: 0.1.0
    stability: experimental
    summary: Declares the one agent-owned process step that snapshots the current run while Codex launches a subagent.
    syntax: ['step name = fork;']
    semantics:
      - The child receives its own run ID, stack, machine, state pointer, limits, and process identity.
      - Parent and child advance independently after the snapshot boundary.
      - The parent handle has parent=true and child=false; the cloned child receives the inverse values.
      - Fork handles expose parent, child, and run_id; after wait they also expose status and result.
      - The first hook carrying the child's stable session_id and agent_id atomically binds that identity to the pending snapshot.
      - Every later child hook routes directly through the same stable identity; no agent command or prompt rewriting is required.
    preconditions:
      - predicate: parent agent has an active bound run
        description: Hamster needs a current process image to snapshot.
        checked: hook
      - predicate: Codex emits subagent lifecycle identity
        description: The child agent ID must be visible in SubagentStart.
        checked: hook
    postconditions:
      - predicate: child run is a complete snapshot of parent state
        description: Mutating the child does not move the parent state pointer.
        guarantee: enforced
        evidence: persisted child run with parent_run_id and fork snapshot
      - predicate: child agent ID is bound to the pending child run ID
        description: Later hook events route directly to the snapshot selected by the observed fork order.
        guarantee: enforced
        evidence: atomic pending-fork claim plus Codex session_id and agent_id
    failures:
      - code: orphan_subagent
        when: Codex starts a child without an observable parent binding.
        remediation: Bind the parent run before spawning the subagent.
    examples:
      - title: Fork a child
        language: hamster
        test: parse
        source: 'goal { verify done = true; } with flow { step child = fork; if child.child { exec child-work; } wait child; }'
    related: [process.exec, process.wait, process.return]

  - id: process.exec
    title: Replace a process image
    kind: process
    aliases: [exec]
    keywords: [exec]
    since: 0.1.0
    stability: experimental
    summary: Replaces the current run's complete machine, stack, state pointer, and machine-local limits.
    syntax: ['exec SCRIPT;']
    semantics:
      - Exec preserves process identity and parent/child relationships.
      - The previous machine image cannot resume after a successful replacement.
      - Exec is runtime-owned; Codex does not issue an exec command.
    preconditions:
      - predicate: current runtime branch reaches exec
        description: Exec targets the current Hamster process after branch evaluation.
        checked: runtime
    postconditions:
      - predicate: current process contains only the replacement machine image
        description: Machine stack, pointer, and local limits come from the replacement.
        guarantee: enforced
        evidence: persisted machine replacement transition
    examples:
      - title: Replace child work
        language: hamster
        test: parse
        source: 'goal { verify done = true; } with flow { step child = fork; if child.child { exec build-provider; } wait child; }'
    related: [process.fork, process.wait]

  - id: process.wait
    title: Wait for a child
    kind: process
    aliases: [wait]
    keywords: [wait]
    since: 0.1.0
    stability: experimental
    summary: Suspends a parent until a direct child terminates, then returns its structured result.
    syntax: ['wait fork-handle;', 'wait [fork-handle, ...];']
    semantics:
      - Waiting is durable across daemon restarts.
      - The current implementation accepts direct children only.
      - Wait is runtime-owned; Hamster suspends and wakes the parent without an agent tool call.
      - While suspended, Codex's native wait_agent operation is allowed to yield; it never advances the state machine itself.
    preconditions:
      - predicate: target run is a direct child of caller
        description: Arbitrary process waiting is not yet permitted.
        checked: runtime
    postconditions:
      - predicate: returned child is terminal
        description: A successful wait returns completion or termination state and result.
        guarantee: enforced
        evidence: persisted child status
    examples:
      - title: Join a child
        language: hamster
        test: parse
        source: 'goal { verify done = true; } with flow { step child = fork; if child.child { exec child-work; } wait child; }'
    related: [process.fork, process.exec, process.return]

  - id: process.return
    title: Process return
    kind: process
    aliases: [process-return]
    since: 0.1.0
    stability: experimental
    summary: Completes a child process, clears its agent binding, and wakes a waiting parent.
    syntax: ['Normal completion of a loop containing return']
    semantics:
      - This is the process-level effect of language return after all verifiers pass.
    postconditions:
      - predicate: child binding is cleared and result is durable
        description: The terminated child no longer governs later agent tool calls.
        guarantee: enforced
        evidence: terminal run status and cleared binding
    examples:
      - title: Child completion
        language: hamster
        test: parse
        source: 'goal { verify finished = true; return "artifact-id"; }'
    related: [statement.return, process.wait]

  - id: process.signal
    title: Probe goal completion
    kind: process
    aliases: [signal, goal-achieved]
    since: 0.1.0
    stability: experimental
    summary: Optionally requests an immediate independent verification probe.
    syntax: ['hamster signal goal-achieved']
    semantics:
      - Declarative goals already probe automatically after every hook-visible tool call.
      - Goals with attached flows probe automatically after each complete flow cycle.
      - This command is an optional early probe and is not a liveness or correctness dependency.
      - Failed or errored verifiers return concrete remediation and begin the next iteration.
      - Replaying the same hook request is idempotent, including after the run completes and unbinds.
    preconditions:
      - predicate: caller has an active bound run at agent work
        description: Completion can only be claimed from a declarative work state.
        checked: hook
    postconditions:
      - predicate: every verifier passed or the run remains incomplete
        description: A signal cannot complete a run without independent verifier evidence.
        guarantee: enforced
        evidence: atomic signal event, state update, and persisted verifier observations
    failures:
      - code: verification_failed
        when: One or more verifiers return false or cannot be evaluated.
        remediation: Continue the reported iteration; Hamster probes again at the cadence defined by the goal.
      - code: wrong_state
        when: The current machine is waiting for an imperative step rather than agent work.
        remediation: Complete the current step before signaling goal-achieved.
    examples:
      - title: Submit work for verification
        language: shell
        test: none
        source: 'hamster signal goal-achieved'
    related: [loop.goal, statement.verify, process.return]

  - id: process.kill
    title: Kill switch
    kind: process
    aliases: [kill]
    since: 0.1.0
    stability: experimental
    summary: Emergency-terminates the current run and removes its agent binding so Hamster itself can be repaired.
    syntax: ['hamster kill --reason TEXT']
    semantics:
      - Kill is handled before ordinary loop policy to prevent policy deadlock.
      - The termination reason remains in the run record.
    postconditions:
      - predicate: run is killed and caller binding is absent
        description: Subsequent tool calls are no longer governed by the killed run.
        guarantee: enforced
        evidence: terminal run status and binding deletion
    examples:
      - title: Emergency brake
        language: shell
        test: none
        source: 'hamster kill --reason "repair Hamster runtime"'
    related: [process.exec]

  - id: primitive.bash-run
    title: bash.run
    kind: primitive
    aliases: [bash.run]
    since: 0.1.0
    stability: experimental
    summary: Requires the agent to issue one exact shell command as a flow step.
    syntax: ['bash.run(command)']
    semantics:
      - The agent owns execution; Hamster advances when the expected hook-visible shell call is observed.
      - Matching proves call occurrence, not the semantic effect of arbitrary shell code.
    preconditions:
      - predicate: command is exposed through a Codex pre-tool hook
        description: Unobservable execution cannot satisfy an exact step.
        checked: hook
    postconditions:
      - predicate: matching command call occurred
        description: Hamster observes the exact expected shell invocation.
        guarantee: observed
        evidence: Codex pre-tool hook payload
    examples:
      - title: Create a branch
        language: hamster
        test: parse
        source: 'goal { verify ok = true; return branch; } with flow { step branch = bash.run("git switch -c fix"); }'
    related: [statement.step, primitive.bash-check]

  - id: primitive.bash-check
    title: bash.check
    kind: primitive
    aliases: [bash.check]
    since: 0.1.0
    stability: experimental
    summary: Runs a shell predicate under runtime ownership and returns true only for exit status zero.
    syntax: ['bash.check(command)']
    semantics:
      - The state machine, not the agent, executes the command during verification.
      - Standard output, standard error, exit code, and duration form verification evidence.
    postconditions:
      - predicate: boolean reflects command exit status
        description: Zero is true; non-zero or execution failure is false.
        guarantee: enforced
        evidence: runtime subprocess result
    examples:
      - title: Verify Git state
        language: hamster
        test: parse
        source: 'goal { verify clean = bash.check("git diff --check"); return true; }'
    related: [statement.verify, primitive.bash-run]

  - id: command.man
    title: Reference manual command
    kind: command
    aliases: [man]
    since: 0.1.0
    stability: experimental
    summary: Looks up, searches, lists, or serializes the embedded Hamster reference catalog.
    syntax: ['hamster man SYMBOL', 'hamster man --search QUERY', 'hamster man --list', 'hamster man --json SYMBOL']
    semantics:
      - The CLI and documentation website consume the same versioned catalog.
    postconditions:
      - predicate: output corresponds to embedded catalog version
        description: Installed CLI documentation cannot drift from its bundled runtime release.
        guarantee: enforced
        evidence: Go embedded reference source
    examples:
      - title: Read fork quickly
        language: shell
        test: none
        source: 'hamster man fork'
    related: [process.fork]

  - id: language.grammar
    title: Complete grammar
    kind: language
    aliases: [grammar, syntax]
    since: 0.1.0
    stability: experimental
    summary: The normative EBNF grammar embedded in the Hamster CLI and published documentation.
    syntax: ['hamster man grammar']
    semantics:
      - Parser behavior is authoritative when an experimental grammar detail conflicts with prose.
    postconditions:
      - predicate: grammar source ships with the CLI
        description: Agents can inspect syntax without network access or external documentation.
        guarantee: enforced
        evidence: embedded language/grammar.ebnf
    examples:
      - title: Show grammar
        language: shell
        test: none
        source: 'hamster man grammar'
    related: [loop.goal, loop.flow, loop.foreach, language.expressions]
